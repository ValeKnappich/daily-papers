date: '2026-09-23'
papers:
- title: 'The network advantage: benefits of interregional scientific knowledge spillovers
    on AI patenting'
  authors:
  - Saverio Barabuffi
  - Jacopo Cricchio
  - Alberto Di Minin
  - Guido Pialli
  summary: Knowledge spillovers have largely been studied as unintended externalities
    diffusing through geographic proximity, while deliberate interregional networks
    have been examined mostly through co-inventor ties rather than the scientific
    layer carried by co-authored publications. This study asks whether spillovers
    from interregional AI-related co-publications increase regional AI patenting,
    and whether the ownership composition of regional R&D shapes the capacity to capitalize
    on them. Using a network-econometric approach across 26 Chinese provincial-level
    regions from 2006 to 2020, we find that co-publication spillovers foster AI patenting,
    but the returns concentrate almost entirely in regions where privately owned enterprises
    dominate R&D, reinforcing regional divergence.
  link: https://arxiv.org/abs/2609.26604v1
  published: '2026-09-22T15:42:39Z'
